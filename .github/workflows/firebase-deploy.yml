name: Deploy to Firebase Hosting (web.app)
on:
  workflow_dispatch:    # 手动触发，避免乱跑
  push:
    branches: [ master ]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'public/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: w9jds/firebase-action@v3
        with:
          args: deploy --only hosting --project lv-recorder
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # 上面的 FIREBASE_TOKEN 需要在 GitHub 仓库 Settings → Secrets 里填
      # 一次性获取方式（在你本机/能访问 firebase 的机器上）：
      #   npm i -g firebase-tools
      #   firebase login:ci
      #   # 把输出的 token 粘到 GitHub secrets