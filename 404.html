<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — lv</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .box { text-align: center; max-width: 480px; }
    .code { font-size: 96px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; color: var(--accent); }
    h1 { font-size: 22px; font-weight: 600; margin: 16px 0 8px; }
    p { color: var(--text-muted); margin-bottom: 24px; }
    a { display: inline-block; padding: 12px 24px; background: var(--bg-inverse); color: var(--bg); border-radius: 999px; font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>ページが見つかりません</h1>
    <p>URLが間違っているか、ページが移動した可能性があります。</p>
    <a href="/">トップへ戻る</a>
  </div>
</body>
</html>
